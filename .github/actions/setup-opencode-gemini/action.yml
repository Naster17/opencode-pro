name: "Setup OpenCode Gemini"
description: "Configure OpenCode CI to use Google Gemini models from environment credentials"
inputs:
  model:
    description: "Default model in provider/model format"
    required: false
    default: "google/gemini-2.5-pro"
  small-model:
    description: "Small model in provider/model format"
    required: false
    default: "google/gemini-2.5-flash"
  enabled-provider:
    description: "Provider ID to allow in CI"
    required: false
    default: "google"
runs:
  using: "composite"
  steps:
    - name: Normalize OpenCode models
      shell: bash
      run: |
        normalize_model() {
          local value="${1#/}"
          value="${value%/}"

          if [[ -z "$value" ]]; then
            return
          fi

          if [[ "$value" == */* ]]; then
            printf '%s' "$value"
            return
          fi

          printf '%s/%s' "${{ inputs.enabled-provider }}" "$value"
        }

        echo "OPENCODE_CI_MODEL=$(normalize_model '${{ inputs.model }}')" >> "$GITHUB_ENV"
        echo "OPENCODE_CI_SMALL_MODEL=$(normalize_model '${{ inputs.small-model }}')" >> "$GITHUB_ENV"

    - name: Write OpenCode config
      shell: bash
      run: |
        mkdir -p "$HOME/.config/opencode"
        cat > "$HOME/.config/opencode/opencode.json" <<EOF
        {
          "\$schema": "https://opencode.ai/config.json",
          "enabled_providers": ["${{ inputs.enabled-provider }}"],
          "model": "${OPENCODE_CI_MODEL}",
          "small_model": "${OPENCODE_CI_SMALL_MODEL}"
        }
        EOF
