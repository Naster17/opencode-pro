name: "Setup OpenCode Gemini"
description: "Configure OpenCode CI to use Google Gemini models from environment credentials"
inputs:
  model:
    description: "Default model in provider/model format"
    required: false
    default: "google/gemini-2.5-pro"
  small-model:
    description: "Small model in provider/model format"
    required: false
    default: "google/gemini-2.5-flash"
  enabled-provider:
    description: "Provider ID to allow in CI"
    required: false
    default: "google"
runs:
  using: "composite"
  steps:
    - name: Write OpenCode config
      shell: bash
      run: |
        mkdir -p "$HOME/.config/opencode"
        cat > "$HOME/.config/opencode/opencode.json" <<EOF
        {
          "\$schema": "https://opencode.ai/config.json",
          "enabled_providers": ["${{ inputs.enabled-provider }}"],
          "model": "${{ inputs.model }}",
          "small_model": "${{ inputs.small-model }}"
        }
        EOF
