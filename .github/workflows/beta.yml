name: beta

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Git Committer
        id: setup-git-committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Configure OpenCode for Gemini
        uses: ./.github/actions/setup-opencode-gemini
        with:
          model: ${{ vars.OPENCODE_BETA_MODEL || vars.OPENCODE_MODEL || 'google/gemma-4-31b-it' }}
          small-model: ${{ vars.OPENCODE_SMALL_MODEL || vars.OPENCODE_FALLBACK_MODEL || 'google/gemma-4-26b-a4b-it' }}
          fallback-model: ${{ vars.OPENCODE_FALLBACK_MODEL || vars.OPENCODE_SMALL_MODEL || 'google/gemma-4-26b-a4b-it' }}
          variant: none

      - name: Install OpenCode
        run: bun i -g opencode-ai

      - name: Sync beta branch
        env:
          GH_TOKEN: ${{ steps.setup-git-committer.outputs.token }}
          OPENCODE_BETA_MODEL: ${{ vars.OPENCODE_BETA_MODEL || vars.OPENCODE_MODEL || 'google/gemma-4-31b-it' }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'google/gemma-4-31b-it' }}
          OPENCODE_FALLBACK_MODEL: ${{ vars.OPENCODE_FALLBACK_MODEL || vars.OPENCODE_SMALL_MODEL || 'google/gemma-4-26b-a4b-it' }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: bun script/beta.ts
