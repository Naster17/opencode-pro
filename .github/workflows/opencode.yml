name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bun

      - name: Configure OpenCode for Gemini
        uses: ./.github/actions/setup-opencode-gemini
        with:
          model: ${{ vars.OPENCODE_ACTION_MODEL || vars.OPENCODE_MODEL || 'google/gemini-2.5-pro' }}
          small-model: ${{ vars.OPENCODE_SMALL_MODEL || 'google/gemini-2.5-flash' }}

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENCODE_PERMISSION: '{"bash": "deny"}'
        with:
          model: ${{ vars.OPENCODE_ACTION_MODEL || vars.OPENCODE_MODEL || 'google/gemini-2.5-pro' }}
